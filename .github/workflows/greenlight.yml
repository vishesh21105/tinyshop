# GreenLight: when the CI workflow fails, find the cause and open a verified fix.
name: GreenLight
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write        # push the greenlight/fix-* branch and comment on the commit
  pull-requests: write   # open the draft pull request
  actions: read          # download the failed run's logs

jobs:
  greenlight:
    # Only failed runs from this repository (never from forks), and never GreenLight's own fix branches.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'greenlight/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: vishesh21105/greenlight@main
        with:
          llm-api-key: ${{ secrets.LLM_API_KEY }}
